<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Navi logo placeholder">
  <title>Navi</title>
  <defs>
    <linearGradient id="naviGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="22" fill="url(#naviGrad)"/>

  <!-- Compass needle: "where you are" → "where you go next" -->
  <path d="M48 22 L62 62 L48 54 L34 62 Z" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="48" cy="54" r="4" fill="url(#naviGrad)"/>
  <circle cx="48" cy="48" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
